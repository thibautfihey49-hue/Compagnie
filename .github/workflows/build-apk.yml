name: Build Compagnie 3D APK

on:
  push:
    branches: [ main, master, 3d ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🎮 Télécharger Godot 4.3 (action officielle)
        uses: abelx/godot-setup@v3
        with:
          version: "4.3.0-stable"
          with-mono: false

      - name: ✅ Vérifier Godot
        run: godot --version

      - name: 📱 Configurer Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: 34
          build-tools: "34.0.0"

      - name: 🔑 Créer keystore temporaire
        run: |
          keytool -genkey -noprompt -alias compagnie -dname "CN=Compagnie, O=Compagnie, C=FR" -keyalg RSA -keysize 2048 -keystore compagnie.keystore -storepass 123456 -keypass 123456 -validity 10000

      - name: 📦 Exporter l'APK
        run: |
          godot --headless --path . --export-release "Android" Compagnie3D.apk

      - name: 📤 Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Compagnie3D-APK
          path: Compagnie3D.apk
          retention-days: 30
