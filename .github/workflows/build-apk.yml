name: Build Compagnie 3D APK

on:
  push:
    branches: [ main, master, 3d ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🎮 Install GodOT 4.2.2 STABLE (FORMAT CONNU)
        run: |
          GV="4.2.2-stable"
          wget "https://github.com/godotengine/godot/releases/download/${GV}/Godot_v${GV}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GV}_linux.x86_64
          sudo mv Godot_v${GV}_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: 📦 Install templates 4.2.2
        run: |
          GV="4.2.2-stable"
          GF="4.2.2.stable"
          wget "https://github.com/godotengine/godot/releases/download/${GV}/Godot_v${GV}_export_templates.tpz" -O tpl.tpz
          DST="$HOME/.local/share/godot/export_templates/${GF}"
          mkdir -p "$DST"
          unzip -q tpl.tpz -d ./tmp
          cp ./tmp/templates/* "$DST/"
          ls -la "$DST"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Keystore
        run: |
          keytool -genkey -noprompt -alias compagnie \
            -dname "CN=Compagnie, O=Compagnie, C=FR" \
            -keyalg RSA -keysize 2048 \
            -keystore compagnie.keystore \
            -storepass 123456 -keypass 123456 -validity 10000

      - name: 🚀 Build APK
        run: bash scripts/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Compagnie3D-APK
          path: Compagnie3D.apk
          retention-days: 30
