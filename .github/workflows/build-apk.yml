name: Build Compagnie 3D APK

on:
  push:
    branches: [ main, master, 3d ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          GODOT_VERSION="4.3-stable"
          wget "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Android export templates
        run: |
          GODOT_VERSION="4.3-stable"
          GODOT_FOLDER="4.3.stable"
          wget "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -O templates.tpz
          TARGET="$HOME/.local/share/godot/export_templates/${GODOT_FOLDER}"
          mkdir -p "$TARGET"
          unzip -q templates.tpz -d ./tmp_tpl
          cp ./tmp_tpl/templates/* "$TARGET/"
          ls -la "$TARGET"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create keystore
        run: |
          keytool -genkey -noprompt -alias compagnie \
            -dname "CN=Compagnie, O=Compagnie, C=FR" \
            -keyalg RSA -keysize 2048 \
            -keystore compagnie.keystore \
            -storepass 123456 -keypass 123456 -validity 10000

      - name: Generate preset + build APK
        run: bash scripts/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Compagnie3D-APK
          path: Compagnie3D.apk
          retention-days: 30
