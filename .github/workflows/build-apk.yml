name: Build Compagnie 3D APK

on:
  push:
    branches: [ main, master, 3d ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🎮 Télécharger Godot 4.3
        run: |
          GODOT_VERSION="4.3-stable"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "Téléchargement Godot : $GODOT_URL"
          wget "$GODOT_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: 📦 Installer les templates d'export (structure CORRECTE)
        run: |
          GODOT_VERSION="4.3-stable"
          GODOT_FOLDER_NAME="4.3.stable"
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          
          echo "Téléchargement templates : $TEMPLATES_URL"
          wget "$TEMPLATES_URL" -O templates.tpz
          
          # ⚠️ CHEMIN CORRECT : ~/.local/share/godot/templates/ (PAS export_templates !)
          TEMPLATES_ROOT="$HOME/.local/share/godot/templates"
          mkdir -p "${TEMPLATES_ROOT}/${GODOT_FOLDER_NAME}"
          
          # Extraire l'archive tpz
          unzip -q templates.tpz -d ./templates_extracted
          
          # 🔍 Voir ce qu'il y a dans l'archive
          echo "📂 Contenu de l'archive tpz :"
          ls -la ./templates_extracted/
          
          # Copier tous les fichiers dans le dossier final
          cp -r ./templates_extracted/* "${TEMPLATES_ROOT}/${GODOT_FOLDER_NAME}/"
          
          # ✅ Vérification finale
          echo ""
          echo "📂 Chemin final : ${TEMPLATES_ROOT}/${GODOT_FOLDER_NAME}/"
          ls -la "${TEMPLATES_ROOT}/${GODOT_FOLDER_NAME}/"
          
          # Vérifier les fichiers essentiels
          if [ -f "${TEMPLATES_ROOT}/${GODOT_FOLDER_NAME}/android_release.apk" ]; then
            echo "✅ Template android_release.apk OK"
          else
            echo "❌ Template android_release.apk INTROUVABLE"
            find ./templates_extracted -name "*.apk" 2>/dev/null || echo "Aucun .apk trouvé dans l'archive"
            exit 1
          fi

      - name: 📱 Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Créer keystore
        run: |
          keytool -genkey -noprompt -alias compagnie -dname "CN=Compagnie, O=Compagnie, C=FR" -keyalg RSA -keysize 2048 -keystore compagnie.keystore -storepass 123456 -keypass 123456 -validity 10000

      - name: 📦 Exporter l'APK
        run: |
          godot --headless --path . --export-release "Android" Compagnie3D.apk

      - name: 📤 Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Compagnie3D-APK
          path: Compagnie3D.apk
          retention-days: 30
