name: Build Compagnie 3D APK

on:
  push:
    branches: [ main, master, 3d ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🎮 Télécharger Godot 4.3
        run: |
          GODOT_VERSION="4.3-stable"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "Téléchargement Godot : $GODOT_URL"
          wget "$GODOT_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: 📦 Télécharger et installer les templates d'export
        run: |
          GODOT_VERSION="4.3-stable"
          # ⚠️ Godot attend le dossier SANS tiret : 4.3.stable
          GODOT_VERSION_DIR="4.3.stable"
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          
          echo "Téléchargement templates : $TEMPLATES_URL"
          wget "$TEMPLATES_URL" -O templates.tpz
          
          # Créer le dossier au CHEMIN EXACT attendu par Godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION_DIR}/
          
          # Extraire les templates
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates/${GODOT_VERSION_DIR}/
          
          # Vérification
          echo "📂 Contenu du dossier templates :"
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION_DIR}/
          
          # Vérifier que les fichiers attendus existent
          if [ -f ~/.local/share/godot/export_templates/${GODOT_VERSION_DIR}/android_release.apk ]; then
            echo "✅ Template android_release.apk trouvé"
          else
            echo "❌ Template android_release.apk INTROUVABLE"
            exit 1
          fi

      - name: 📱 Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Créer keystore
        run: |
          keytool -genkey -noprompt -alias compagnie -dname "CN=Compagnie, O=Compagnie, C=FR" -keyalg RSA -keysize 2048 -keystore compagnie.keystore -storepass 123456 -keypass 123456 -validity 10000

      - name: 📦 Exporter l'APK
        run: |
          godot --headless --path . --export-release "Android" Compagnie3D.apk

      - name: 📤 Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Compagnie3D-APK
          path: Compagnie3D.apk
          retention-days: 30
