name: Build Compagnie 3D APK

on:
  push:
    branches: [ main, master, 3d ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🎮 Télécharger Godot 4.3 Headless
        run: |
          GODOT_VERSION="4.3"
          GODOT_URL="https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "Téléchargement depuis : $GODOT_URL"
          wget "$GODOT_URL" -O godot.zip
          unzip godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: 📱 Configurer Android SDK
        run: |
          mkdir -p ~/.android
          echo "export ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "export ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          
          # Télécharger Android Command Line Tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076607_latest.zip -O /tmp/cmd-tools.zip
          unzip -q /tmp/cmd-tools.zip -d /tmp
          mkdir -p $ANDROID_HOME/cmdline-tools
          mv /tmp/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          
          # Installer les composants
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: 🔑 Créer keystore temporaire
        run: |
          keytool -genkey -noprompt -alias compagnie -dname "CN=Compagnie, O=Compagnie, C=FR" -keyalg RSA -keysize 2048 -keystore compagnie.keystore -storepass 123456 -keypass 123456 -validity 10000

      - name: 📦 Exporter l'APK
        run: |
          godot --headless --path . --export-release "Android" Compagnie3D.apk

      - name: 📤 Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Compagnie3D-APK
          path: Compagnie3D.apk
          retention-days: 30
